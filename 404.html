<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#b51217">
  
  <title>Seite nicht gefunden — MUKASI</title>
  <meta name="description" content="Die angeforderte Seite wurde nicht gefunden.">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="stylesheet" href="assets/css/styles.modern.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-mukasi.svg">
  
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      background: linear-gradient(135deg, var(--color-accent) 0%, white 100%);
    }
    
    .error-content {
      text-align: center;
      max-width: 600px;
    }
    
    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: var(--space-md);
      opacity: 0.2;
      font-family: var(--font-display);
    }
    
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: var(--space-md);
    }
    
    .error-message {
      font-size: 1.125rem;
      color: var(--color-text-light);
      margin-bottom: var(--space-xl);
    }
    
    .error-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-lg);
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-content">
      <img src="assets/img/notenschluessel.png" alt="MUKASI Logo" class="error-logo">
      <div class="error-code">404</div>
      <h1 class="error-title">Seite nicht gefunden</h1>
      <p class="error-message">
        Die angeforderte Seite existiert leider nicht oder wurde verschoben.
      </p>
      <div class="actions">
        <a href="index.html" class="btn btn-primary">Zur Startseite</a>
        <a href="kontakt.html" class="btn btn-secondary">Kontakt</a>
      </div>
    </div>
  </main>
</body>
</html>
